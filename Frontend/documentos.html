<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos Aduaneros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        :root {
            --color-principal: #0F2A43; --color-hover: #F59E0B; --color-fondo: #f4f4f4;
            --texto-oscuro: #333333; --color-ok: #27ae60; --color-falta: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--color-fondo); display: flex; flex-direction: column; min-height: 100vh; }
        .container { flex: 1; max-width: 1200px; width: 100%; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); margin-bottom: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: center; min-width: 650px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        th { background-color: #eaeff3; color: var(--texto-oscuro); }
        td.text-left { text-align: left; }
        .icon-ok { color: var(--color-ok); font-size: 1.2rem; }
        .icon-falta { color: var(--color-falta); font-size: 1.2rem; }
        .progreso-badge { font-weight: 700; }
        .btn-gestionar { background-color: var(--color-principal); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .btn-gestionar:hover { background-color: var(--color-hover); }
        #panelArchivos { display: none; border-left: 5px solid var(--color-principal); }
        .grid-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-upload { display: flex; flex-direction: column; gap: 10px; }
        .form-upload select, .form-upload input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-subir { background-color: var(--color-principal); color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .lista-archivos { list-style: none; }
        .lista-archivos li { padding: 10px; background: #f9f9f9; border: 1px solid #eee; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .lista-archivos .estado-req { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
        .estado-Pendiente { background: #fef3c7; color: #b45309; }
        .estado-Entregado { background: #dcfce7; color: #15803d; }
        .estado-Rechazado { background: #fee2e2; color: #b91c1c; }
        .estado-Vencido { background: #fee2e2; color: #b91c1c; }
        .btn-descargar { color: var(--color-principal); text-decoration: none; font-weight: bold; }
        @media (max-width: 768px) { .grid-panel { grid-template-columns: 1fr; } .btn-gestionar { width: 100%; } }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="container">
        <h2 style="margin-bottom: 20px; color: var(--texto-oscuro);"><i class="fa-solid fa-folder-open"></i> Checklist de Expedientes</h2>

        <div class="card">
            <table>
                <thead>
                    <tr><th class="text-left">VIN / Vehículo</th><th>Requisitos Entregados</th><th>Acción</th></tr>
                </thead>
                <tbody id="tablaChecklist"></tbody>
            </table>
        </div>

        <div class="card" id="panelArchivos">
            <h3 id="tituloPanel" style="margin-bottom: 15px; color: var(--color-principal);">Gestionando Expediente</h3>
            <div class="grid-panel">
                <div>
                    <h4>Subir Documento</h4><br>
                    <form class="form-upload" id="formSubir">
                        <input type="hidden" id="expIdOculto">
                        <select id="reqSelect" required>
                            <option value="">Seleccione el requisito...</option>
                        </select>
                        <input type="file" id="archivoFisico" required accept=".pdf,image/jpeg,image/png">
                        <button type="submit" class="btn-subir"><i class="fa-solid fa-cloud-arrow-up"></i> Subir Archivo</button>
                    </form>
                </div>
                <div>
                    <h4>Checklist de este expediente</h4><br>
                    <ul class="lista-archivos" id="listaArchivosRender"></ul>
                </div>
            </div>
        </div>
    </div>

    <footer style="background-color: var(--color-principal); color: white; text-align: center; padding: 10px; font-size: 0.8rem; margin-top: auto;">
        Importadora Los Gemelos &copy; 2026
    </footer>

    <script src="/components/navbar.js" defer></script>
    <script src="/js/documentos.js" defer></script>
</body>
</html>
