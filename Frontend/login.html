<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script>
        const usuarioYaLogueado = localStorage.getItem('usuarioLogueado');
        if (usuarioYaLogueado) {
            window.location.replace('pantallaPrincipal.html');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-principal: #6A89A7;
            --color-hover: #4e657a;
            --color-fondo: #f4f4f4;
            --texto-oscuro: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--color-fondo);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-icon {
            margin-bottom: 10px;
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .login-container h2 {
            color: var(--texto-oscuro);
            margin-bottom: 5px;
        }

        .login-container p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-oscuro);
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--color-principal);
            box-shadow: 0 0 5px rgba(166, 25, 25, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--color-principal);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        .btn-login:hover {
            background-color: var(--color-hover);
        }

        #error-msg {
            color: red;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 24px;
                margin: 20px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
            }

            .login-container h2 {
                font-size: 1.4rem;
            }

            .btn-login {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-icon">
            <img src="assets/images/logo.jpg" alt="Logo de la empresa" class="login-logo">
        </div>
        <h2>Importadora Los Gemelos</h2>
        <p>Sistema de Gestión Logística</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@losgemelos.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar al Sistema</button>
            <div id="error-msg">Credenciales incorrectas. Intente nuevamente.</div>
        </form>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const emailInput = document.getElementById('email').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        try {
            const response = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    email: emailInput, 
                    contrasena: passwordInput 
                })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                errorMsg.style.display = 'none';
                window.location.href = 'pantallaPrincipal.html';
            } else {
                errorMsg.textContent = data.error;
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error('Error al conectar con el servidor:', error);
            errorMsg.textContent = "Error de conexión con el servidor.";
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
