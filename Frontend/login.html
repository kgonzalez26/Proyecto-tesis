<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-principal: #0F2A43;
            --color-hover: #F59E0B;
            --color-fondo: #f4f4f4;
            --texto-oscuro: #333333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--color-fondo); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-logo { width: 90px; height: 90px; object-fit: contain; margin-bottom: 20px; }
        .login-container h2 { color: var(--texto-oscuro); margin-bottom: 5px; }
        .login-container p { color: #666; font-size: 0.9rem; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--texto-oscuro); font-weight: 500; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        .input-group input:focus { outline: none; border-color: var(--color-principal); }
        .btn-login { width: 100%; padding: 12px; background-color: var(--color-principal); color: white; border: none; border-radius: 5px; font-size: 1.1rem; cursor: pointer; transition: background 0.3s; font-weight: bold; }
        .btn-login:hover { background-color: var(--color-hover); }
        #error-msg { color: red; font-size: 0.9rem; margin-top: 15px; display: none; }
        .aviso-registro { font-size: 0.8rem; color: #888; margin-top: 4px; }
        @media (max-width: 500px) {
            .login-container { padding: 24px; margin: 20px; }
            .login-logo { width: 70px; height: 70px; }
            .login-container h2 { font-size: 1.4rem; }
            .btn-login { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-icon">
            <img src="assets/images/logo.jpg" alt="Logo de la empresa" class="login-logo">
        </div>
        <h2>Importadora Los Gemelos</h2>
        <p>Sistema de Gestión Logística</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@losgemelos.com" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
            <div id="error-msg">Credenciales incorrectas. Intente nuevamente.</div>
        </form>

        <div style="margin-top:12px; text-align:center;">
            <small>¿No tienes cuenta?</small>
            <button id="showRegister" style="background:none;border:none;color:var(--color-principal);cursor:pointer;font-weight:bold;margin-left:6px;">Crear cuenta</button>
        </div>

        <form id="registerForm" style="display:none;margin-top:18px; text-align:left;">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Tu nombre completo" required maxlength="50">
            </div>
            <div class="input-group">
                <label for="emailReg">Correo Electrónico</label>
                <input type="email" id="emailReg" placeholder="ejemplo@losgemelos.com" required>
            </div>
            <div class="input-group">
                <label for="passwordReg">Contraseña</label>
                <input type="password" id="passwordReg" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
            <div class="input-group">
                <label for="passwordReg2">Confirmar contraseña</label>
                <input type="password" id="passwordReg2" placeholder="••••••••" required>
            </div>
            <p class="aviso-registro">Tu cuenta quedará registrada como cliente: podrás dar seguimiento a tus vehículos y guardar tus cotizaciones.</p>
            <button type="submit" class="btn-login" style="background:#28a745; margin-top:12px;">Crear Cuenta</button>
            <div id="register-msg" style="display:none;margin-top:10px;font-size:0.95rem;"></div>
        </form>
    </div>

    <script src="/js/login.js" defer></script>
</body>
</html>
