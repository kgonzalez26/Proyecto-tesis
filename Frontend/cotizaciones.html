<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones - Importadora Los Gemelos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        :root {
            --color-principal: #0F2A43; --color-hover: #F59E0B; --color-fondo: #dbe2e9;
            --bg-card: #ffffff; --texto-oscuro: #2c3e50; --texto-mutado: #64748b; --border-color: #e2e8f0;
            --verde-exito: #16a34a; --rojo-error: #dc2626; --naranja-pendiente: #d97706;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--color-fondo); display: flex; flex-direction: column; min-height: 100vh; color: var(--texto-oscuro); }

        .main-container { flex: 1; max-width: 1300px; width: 100%; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 300px 1fr 320px; gap: 16px; height: calc(100vh - 120px); }
        .card-panel { background: var(--bg-card); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; }

        .panel-header { padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid var(--border-color); }
        .panel-header h3 { font-size: 1.02rem; font-weight: 700; color: #1e293b; }
        .panel-header p { font-size: 0.75rem; color: var(--texto-mutado); margin-top: 2px; }

        .search-box { padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; outline: none; }

        .lista-scroll { flex: 1; overflow-y: auto; }
        .item-lista { position: relative; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s; }
        .item-lista:hover { background-color: #f8fafc; }
        .item-lista.active { background-color: #edf4fa; border-left: 4px solid var(--color-principal); }
        .item-titulo { font-size: 0.88rem; font-weight: 700; color: #1e293b; }
        .item-subtitulo { font-size: 0.76rem; color: var(--texto-mutado); margin-top: 2px; }

        .badge-estado { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; display: inline-block; margin-top: 4px; }
        .badge-Borrador, .badge-Pendiente_Validacion { background: #fef3c7; color: var(--naranja-pendiente); }
        .badge-Aprobada { background: #dcfce7; color: var(--verde-exito); }
        .badge-Rechazada { background: #fee2e2; color: var(--rojo-error); }
        .badge-Enviada { background: #e0e7ff; color: #3730a3; }
        .badge-Solicitada { background: #dbeafe; color: #1d4ed8; }
        .badge-Atendida { background: #e2e8f0; color: #475569; }
        .badge-solicitudes { background: #2563eb; color: white; font-size: 0.65rem; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }

        .cierre-venta { margin-top: 18px; padding-top: 14px; border-top: 1px dashed #cbd5e1; }
        .cierre-venta h5 { font-size: 0.9rem; color: #1e293b; margin-bottom: 8px; }
        .venta-registrada { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; margin-bottom: 10px; }
        .fila-venta { display: flex; gap: 8px; flex-wrap: wrap; }
        .fila-venta select { flex: 2; min-width: 180px; }
        .fila-venta input { flex: 1; min-width: 120px; }
        .fila-venta select, .fila-venta input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.85rem; }

        .detalle-vacio { flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 30px; }

        .detalle-body { flex: 1; overflow-y: auto; padding: 20px; }
        .detalle-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
        .detalle-header h4 { font-size: 1.1rem; color: #1e293b; }
        .detalle-header p { font-size: 0.8rem; color: var(--texto-mutado); margin-top: 2px; }

        .desglose { background: #f8fafc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .fila-desglose { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 6px 0; border-bottom: 1px solid #eef2f6; }
        .fila-desglose:last-child { border-bottom: none; }
        .fila-desglose.total { font-weight: 800; font-size: 1rem; border-top: 2px solid #cbd5e1; margin-top: 6px; padding-top: 10px; }
        .fila-desglose.margen-positivo span:last-child { color: var(--verde-exito); font-weight: 700; }
        .fila-desglose.margen-negativo span:last-child { color: var(--rojo-error); font-weight: 700; }

        .meta-info { font-size: 0.78rem; color: var(--texto-mutado); margin-bottom: 16px; line-height: 1.6; }

        .acciones-cotizacion { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-accion { border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: white; display: flex; align-items: center; gap: 6px; }
        .btn-validar { background: var(--verde-exito); }
        .btn-rechazar { background: var(--rojo-error); }
        .btn-enviar { background: var(--color-principal); }
        .nota-envio { font-size: 0.75rem; color: var(--texto-mutado); margin-top: 10px; }

        .btn-icon { background: none; border: none; color: var(--color-principal); cursor: pointer; font-size: 1rem; padding: 6px; border-radius: 4px; }
        .btn-icon:hover { background: #e2e8f0; }
        .btn-editar-cliente { position: absolute; top: 8px; right: 8px; font-size: 0.72rem; padding: 4px 6px; opacity: 0.55; }
        .item-lista:hover .btn-editar-cliente { opacity: 1; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 8px; width: 100%; max-width: 420px; }
        .modal-box-header { background: var(--color-principal); color: white; padding: 14px 20px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .modal-box-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .modal-box-body label { font-size: 0.8rem; font-weight: 700; color: #475569; }
        .modal-box-body input { padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.88rem; outline: none; }
        .modal-box-footer { padding: 14px 20px; background: #f8fafc; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; border-radius: 0 0 8px 8px; }

        .footer { background-color: var(--color-principal); color: white; text-align: center; padding: 10px; font-size: 0.8rem; margin-top: auto; }

        @media (max-width: 1100px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .card-panel { height: 400px; }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="main-container">

        <div class="card-panel">
            <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Clientes</h3>
                <button class="btn-icon" id="btnNuevoCliente" title="Nuevo cliente"><i class="fa-solid fa-user-plus"></i></button>
            </div>
            <div class="search-box"><input type="text" id="inputBuscarCliente" placeholder="Buscar cliente..."></div>
            <div class="lista-scroll" id="listaClientes">
                <div style="padding:16px; text-align:center; color:#888; font-size:0.85rem;">Cargando...</div>
            </div>
        </div>

        <div class="card-panel">
            <div class="panel-header" id="headerDetalle"><h3>Selecciona una cotización</h3></div>
            <div id="contenidoDetalle" class="detalle-vacio">
                Elige un cliente y luego una de sus cotizaciones guardadas para ver el desglose, validarla o imprimirla.
            </div>
        </div>

        <div class="card-panel">
            <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3>Cotizaciones guardadas</h3>
                    <p id="subtituloCotizaciones">Selecciona un cliente</p>
                </div>
                <a id="linkNuevaCotizacion" href="calculadoraCostos.html" class="btn-icon" title="Nueva cotización para este cliente" style="display:none; text-decoration:none;">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </div>
            <div class="lista-scroll" id="listaCotizaciones">
                <div style="padding:16px; text-align:center; color:#888; font-size:0.85rem;">—</div>
            </div>
        </div>

    </main>

    <div class="modal-overlay" id="modalNuevoCliente">
        <div class="modal-box">
            <div class="modal-box-header">
                <h3 style="font-size:1rem;" id="tituloModalCliente">Nuevo Cliente</h3>
                <button class="btn-icon" id="btnCerrarModalCliente" style="color:white;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="formNuevoCliente">
                <div class="modal-box-body">
                    <div><label>Nombre completo</label><input type="text" id="clienteNombre" required></div>
                    <div><label>Correo electrónico</label><input type="email" id="clienteEmail" required></div>
                    <div><label>Teléfono (opcional)</label><input type="text" id="clienteTelefono"></div>
                    <div><label>NIT (opcional)</label><input type="text" id="clienteNit"></div>
                </div>
                <div class="modal-box-footer">
                    <button type="button" class="btn-cancel" id="btnCancelarCliente" style="background:white; border:1px solid #cbd5e1; padding:8px 16px; border-radius:5px; cursor:pointer; font-weight:600; color:#475569;">Cancelar</button>
                    <button type="submit" class="btn-accion btn-enviar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">Importadora Los Gemelos &copy; 2026</footer>

    <script src="/components/navbar.js" defer></script>
    <script src="/js/cotizaciones.js" defer></script>
</body>
</html>
